name: Run CI tests

on: [ push ]

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              id: setup-php
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.4'

            - uses: "ramsey/composer-install@v2"

            - name: Run test suite
              run: php bin/phpunit
